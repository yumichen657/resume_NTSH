{% extends "base.html" %}

{% block title %}課外活動{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/activities.css') }}">
{% endblock %}

{% block body %}
<header>
    <h1>課外活動</h1>
</header>
<section>
    <div class="card">
        <!-- 小圖示與主標題 -->
        <div class="card-title">
            🪴 社團成果：藝術創作
        </div>

        <!-- 大圖片 -->
        <img src="{{ url_for('static', filename='images/2121.jpg') }}" alt="社團成果照片" class="main-img">

        <!-- 問答表單 -->
        <form action="/activities" method="post">
            <div class="form-group">
                <label for="question">你的問題：</label>
                <input type="text" id="question" name="question" value="{{ question }}">
            </div>

            <div class="form-group">
                <label for="answer">答案：</label>
                <input type="text" id="answer" name="answer" readonly value="{{ answer }}">
            </div>

            <div class="btn-group">
                <input type="submit" value="送出">
                <input type="button" value="回首頁" onclick="window.location.href='/'">
            </div>
        </form>
    </div>
</section>
{% endblock %}
