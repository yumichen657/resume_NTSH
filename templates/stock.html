{% extends "base.html" %}

{% block title %}查詢股價{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/stock.css') }}">
{% endblock %}

{% block body %}
<header>
    <h1>查詢股價</h1>
</header>
<section>
    <div class="form-box">
        <form action="/stock" method="post">
            <label for="question">股票號碼:</label><br>
            <input type="text" id="question" name="question" value="{{ question }}"><br><br>
            <label for="answer">股價:</label><br>
            <input type="text" id="answer" name="answer" readonly value="{{ answer }}"><br><br>
            <input type="submit" value="送出">
            <input type="button" value="回首頁" onclick="window.location.href='/'">
        </form>
    </div>
</section>
{% endblock %}
